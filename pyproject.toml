[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fastapi-docs-rag"
version = "0.1.0"
description = "Captured FastAPI documentation for an evidence-grounded assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<0.29",
    "tokenizers>=0.21,<0.24",
    "psycopg[binary]>=3.2,<4",
    "sentence-transformers>=5.1,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
